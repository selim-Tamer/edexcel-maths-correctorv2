# Stage S5 (Phase 9): reviewable, automated dependency updates.
# Security advisories additionally surface via GitHub's dependency-graph
# Dependabot alerts (repository settings) and the pip-audit CI job.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "test-deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
