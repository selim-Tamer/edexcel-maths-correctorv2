{
  "name": "BR-02 isolated PostgreSQL integration",
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "br02-postgres-integration",
    "cancel-in-progress": false
  },
  "jobs": {
    "integration": {
      "if": "github.event_name == 'workflow_dispatch' && inputs.approve_execution && github.event.repository.private == false && github.actor == 'selim-Tamer' && github.run_attempt == 1 && github.ref == 'refs/heads/br-02/postgres-result-persistence' && inputs.approved_sha == github.sha",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "services": {
        "postgres": {
          "image": "postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac",
          "env": {
            "POSTGRES_USER": "br02_bootstrap",
            "POSTGRES_PASSWORD": "bootstrap-ci-only",
            "POSTGRES_DB": "br02_ci",
            "POSTGRES_INITDB_ARGS": "--encoding=UTF8 --locale=C --data-checksums"
          },
          "ports": [
            "127.0.0.1:55432:5432"
          ],
          "options": "--memory=1g --cpus=2 --log-driver none --health-cmd \"pg_isready -U br02_bootstrap -d br02_ci\" --health-interval 5s --health-timeout 5s --health-retries 12"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "ref": "${{ inputs.approved_sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Install existing test dependencies and child server",
          "run": "python -m pip install -r tests/pdf-requirements.txt 'uvicorn>=0.53,<0.54'"
        },
        {
          "name": "CI boundary offline regressions",
          "run": "python -B tests/test_br02_pg_ci_context.py"
        },
        {
          "name": "Offline harness gate",
          "run": "python -B tests/run_br02_pg_harness.py --mode offline"
        },
        {
          "name": "Isolated synthetic integration subset",
          "timeout-minutes": 9,
          "env": {
            "BR02_CI_APPROVED_SHA": "${{ inputs.approved_sha }}",
            "BR02_CI_CONTAINER": "${{ job.services.postgres.id }}"
          },
          "run": "sudo --preserve-env=PATH,GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_SHA,BR02_CI_APPROVED_SHA,BR02_CI_CONTAINER,ACTIONS_ID_TOKEN_REQUEST_URL,ACTIONS_ID_TOKEN_REQUEST_TOKEN \"$(command -v python)\" -B tests/run_br02_pg_ci.py"
        }
      ]
    }
  },
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "approve_execution": {
          "type": "boolean",
          "default": false,
          "required": true
        },
        "approved_sha": {
          "description": "Independently reviewed BR-02 commit SHA",
          "type": "string",
          "required": true
        }
      }
    }
  }
}
