name: Maths marker regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/review-state-and-marking-safety]
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # v4.3.1 (full commit SHA; supply-chain pin, S5 F-11)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        # v5.6.0 (full commit SHA; supply-chain pin, S5 F-11)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Syntax validation
        run: python -m py_compile app5_1_automated.py document_pipeline.py local_pdf.py marking_requests.py pipeline_metrics.py
      - name: Install offline PDF and symbolic benchmark dependencies
        # Patch pip first (pip itself carries advisories between releases),
        # then install the single complete test manifest from tests/.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/pdf-requirements.txt
      - name: Offline document benchmark
        run: python tests/benchmark_document_pipeline.py
      - name: Offline local processing benchmark
        run: python tests/benchmark_local_processing.py
      - name: Permissive PDF inspection benchmark
        run: python tests/benchmark_pdf_inspection.py
      - name: Offline marking request benchmark
        run: python tests/benchmark_marking_requests.py
      - name: Offline service recovery benchmark
        run: python tests/benchmark_service_recovery.py
      - name: Offline automatic recovery benchmark
        run: python tests/benchmark_automatic_recovery.py
      - name: Offline provider deadline benchmark
        run: python tests/benchmark_deadline_recovery.py
      - name: Offline gemini rate-limit gate benchmark
        run: python tests/benchmark_gemini_limits.py
      - name: Run marking regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run offline accuracy evaluator regression tests
        run: python -m unittest investigation.test_accuracy_regression -v

  streamlit-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python: '3.11'
            sdk: '1.40.0'
            streamlit: '1.65.0'
          - python: '3.14'
            sdk: '2.30.1'
            streamlit: '1.65.0'
          - python: '3.14'
            sdk: '2.31.0'
            streamlit: '1.66.0'
    steps:
      - name: Check out repository
        # v4.3.1 (full commit SHA; supply-chain pin, S5 F-11)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        # v5.6.0 (full commit SHA; supply-chain pin, S5 F-11)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install UI test dependency
        # Match Community Cloud's replacement of affected PyArrow 25/26 builds.
        run: |
          python -m pip install --upgrade pip
          python -m pip install streamlit==${{ matrix.streamlit }} google-genai==${{ matrix.sdk }} pyarrow==24.0.0 -r tests/pdf-requirements.txt
      - name: Run real Streamlit interaction tests
        run: python -m unittest discover -s tests/ui -p 'test_*.py' -v
      - name: Validate minimum Gemini SDK with intercepted HTTP
        run: python -m unittest discover -s tests/sdk -p 'test_*.py' -v

  dependency-audit:
    # Stage S5 (Phase 9): scans the resolved production and test dependency
    # sets with pip-audit (PyPA advisory database). The job fails on any
    # published advisory so findings are actionable; maintainers respond per
    # the remediating steps documented in TESTING.md. No secrets are used.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # v4.3.1 (full commit SHA; supply-chain pin, S5 F-11)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        # v5.6.0 (full commit SHA; supply-chain pin, S5 F-11)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet pip-audit
      - name: Audit production dependency set (requirements.txt)
        # --strict: resolution errors also fail the job, so a skipped or
        # incomplete scan can never be reported as a clean audit.
        run: pip-audit --strict -r requirements.txt
      - name: Audit test dependency set (tests/pdf-requirements.txt)
        run: pip-audit --strict -r tests/pdf-requirements.txt

  report-scheduled-failure:
    # Automatic issue reporting is limited to scheduled/main runs.
    # No grading API keys or private student PDFs are used in CI.
    if: ${{ always() && needs.offline-tests.result == 'failure' && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    needs: [offline-tests]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or update regression issue
        # v7.1.0 (full commit SHA; supply-chain pin, S5 F-11)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = "Automated maths-marker regression tests failing";
            const { owner, repo } = context.repo;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `Regression tests failed at ${new Date().toISOString()}.\n\nRun: ${url}\n\nFix the failing tests in a PR; do not auto-merge. Do not commit student PDFs or API tokens.\n`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const issue = existing.find(i => !i.pull_request && i.title === title);
            if (issue) {
              await github.rest.issues.createComment({owner, repo, issue_number: issue.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }
